<div class="quote-page">
    <div class="get-quote-form-container">
      <h2>Get a Quote - Note: This Page Work is in progress - !!!</h2>
  
      <form [formGroup]="quoteForm" (ngSubmit)="submitQuote()">
        <div class="form-group">
          <label>Name:</label>
          <input type="text" formControlName="name" />
        </div>
  
        <div class="form-group">
          <label>Email:</label>
          <input type="email" formControlName="email" />
        </div>
  
        <div class="form-group">
          <label>Phone (optional):</label>
          <input type="tel" formControlName="phone" />
        </div>
  
        <div class="form-group">
          <label>Service Type:</label>
          <input type="text" formControlName="serviceType" />
        </div>
  
        <div class="form-group">
          <label>Message / Details:</label>
          <textarea rows="5" formControlName="message"></textarea>
        </div>
  
        <button type="submit" class="quote-submit-btn btn btn-disabled" [disabled]="quoteForm.invalid">
          Submit Quote Request
        </button>
      </form>
    </div>
  </div>
